services:
  blazorhosted:
    image: blazorhosted
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_CONNECTION_STRING=data source=sqlserver;initial catalog=AppProject;App=EntityFramework;user id=sa;password=FHDw(!)1234;TrustServerCertificate=True
    ports:
      - 6080:80
      - 6443:443
    depends_on: 
      - sqlserver 
  
  sqlserver:
    image: mcmoe/mssqldocker:latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - SA_PASSWORD=FHDw(!)1234
      - MSSQL_DB=AppProject
      - e='Y'
    ports:
      - 5000:1433